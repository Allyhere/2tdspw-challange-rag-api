services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Aguardando Ollama..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Baixando embeddinggemma..."
        ollama pull embeddinggemma
        echo "Baixando llama3.2:3b..."
        ollama pull llama3.2:3b
        echo "Modelos prontos."
    restart: "no"

  seed:
    build:
      context: ./api
      dockerfile: ../Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      OLLAMA_BASE_URL: http://ollama:11434
      EMBED_MODEL: embeddinggemma
      NLP_MODEL: llama3.2:3b
    volumes:
      - ./api/data:/app/data:ro
    command: ["node", "data/seed.js"]
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: ../Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      OLLAMA_BASE_URL: http://ollama:11434
      EMBED_MODEL: embeddinggemma
      NLP_MODEL: llama3.2:3b
    depends_on:
      neo4j:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

volumes:
  neo4j_data:
  ollama_data:
