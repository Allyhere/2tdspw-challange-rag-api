services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  seed:
    build:
      context: ./api
      dockerfile: ../Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      EMBED_MODEL: ${EMBED_MODEL:-gemini-embedding-001}
      NLP_MODEL: ${NLP_MODEL:-gemini-3.5-flash-lite}
    volumes:
      - ./api/data:/app/data:ro
    command: ["node", "data/seed.js"]
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: ../Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      EMBED_MODEL: ${EMBED_MODEL:-gemini-embedding-001}
      NLP_MODEL: ${NLP_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      neo4j:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  neo4j_data:
